[package]
name = "lenso-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Embeddable convention processing engine"

[dependencies]
anyhow = "1"
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal"] }
