[package]
name = "lenso-engine-worker"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Precompiled optional Markdown processor for Lenso Engine"

[dependencies]
lenso-engine = { path = "../lenso-engine", version = "0.1.0" }
lenso-engine-markdown = { path = "../lenso-engine-markdown", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
