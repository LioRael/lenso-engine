[package]
name = "lenso-engine-authoring"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Lenso App discovery, composition and authoring authority"

[dependencies]
anyhow = "1.0"
lenso-app-plan = { version = "0.4.1" }
lenso-plugin-bundle = { version = "0.4.2" }
lenso-plugin-catalog = { path = "../lenso-plugin-catalog", version = "0.1.0", features = ["bundle-verification"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
rustix = { version = "1.1", features = ["fs"] }
tempfile = { workspace = true }
toml = { workspace = true }
uuid = { version = "1", features = ["v7"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2.5"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
jsonschema = { version = "0.51", default-features = false }
glob = "0.3.3"

[target.'cfg(windows)'.dependencies]
winsafe = { version = "0.0.19", features = ["kernel"] }

[dev-dependencies]
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
