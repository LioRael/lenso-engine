[package]
name = "lenso-plugin-catalog"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Portable signed Lenso Plugin catalog protocol and verification."
readme = "README.md"
include = ["/src/**/*.rs", "/tests/**", "/README.md", "/Cargo.toml"]

[features]
default = []
# Native CLI compatibility; Workers must use the portable default feature set.
bundle-verification = ["dep:lenso-plugin-bundle"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
ed25519-dalek = "2.2"
hex = "0.4"
lenso-plugin-bundle = { version = "0.4.2", optional = true }
semver = "1.0"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
url = "2.5"

[lints]
workspace = true
