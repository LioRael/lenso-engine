[workspace]
resolver = "2"
members = [
    "crates/lenso-engine",
    "crates/lenso-engine-app",
    "crates/lenso-engine-markdown",
    "crates/lenso-engine-authoring",
    "crates/lenso-engine-runtime",
    "crates/lenso-engine-worker",
    "crates/lenso-engine-host",
    "crates/lenso-plugin-catalog",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/LioRael/lenso-engine"
rust-version = "1.94"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.52", features = ["io-util", "macros", "net", "process", "rt", "signal", "time"] }
tempfile = "3.23"
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
